[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-contracts-platform"
version = "0.1.0"
description = "Stops an upstream change silently breaking every downstream dashboard: producers publish a contract and CI blocks breaking changes."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0.2"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pip-audit>=2.7"]

[project.scripts]
datacontract = "data_contracts_platform.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Bugs, security (bandit), modern syntax, imports, naming and test style; `ruff format` owns line length.
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "N", "C4", "PT", "RET", "PIE", "PERF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests use assert on purpose.
"tests/**" = ["S101"]
